name: Deploy static site to Pages

# Proactively using GitHub Actions-based Pages instead of the legacy
# branch-based builder, based on direct experience the same day: the legacy
# builder failed repeatedly on a sibling site (mycelix.net) with a generic,
# undiagnosable "Page build failed" error. This is plain static HTML/CSS,
# no build step needed -- just upload-and-deploy.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
