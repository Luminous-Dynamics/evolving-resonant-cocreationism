name: Code Quality Validation

on:
  push:
    branches: [main, claude/**]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate HTML files
        run: |
          echo "Checking HTML files for common issues..."
          # Check for proper DOCTYPE
          for file in *.html appendix-*.html; do
            if [ -f "$file" ]; then
              if ! grep -q "<!DOCTYPE html>" "$file"; then
                echo "❌ Missing DOCTYPE in $file"
                exit 1
              else
                echo "✅ $file has DOCTYPE"
              fi
            fi
          done

      - name: Validate CSS files
        run: |
          echo "Checking CSS files exist..."
          if [ ! -f "css/main.css" ]; then
            echo "❌ css/main.css not found"
            exit 1
          fi
          echo "✅ CSS files found"

      - name: Validate JavaScript files
        run: |
          echo "Checking JavaScript files..."
          for js in js/*.js; do
            if [ -f "$js" ]; then
              # Basic syntax check
              node --check "$js"
              echo "✅ $js syntax valid"
            fi
          done

      - name: Check for security issues
        run: |
          echo "Checking for common security issues..."
          # Check for inline event handlers
          if grep -r "onclick=" *.html 2>/dev/null | grep -v ".git"; then
            echo "⚠️  Warning: Found inline onclick handlers"
          fi
          if grep -r "onerror=" *.html 2>/dev/null | grep -v ".git"; then
            echo "⚠️  Warning: Found inline onerror handlers"
          fi
          echo "✅ Security checks complete"

      - name: Validate package.json
        run: |
          echo "Validating package.json..."
          npm pkg get name description version license
          echo "✅ package.json is valid"

      - name: Check required files
        run: |
          echo "Checking for required open-source files..."
          required_files=(
            "README.md"
            "LICENSE"
            "CONTRIBUTING.md"
            "CODE_OF_CONDUCT.md"
            "SECURITY.md"
            ".gitignore"
            ".editorconfig"
            "package.json"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "❌ Missing required file: $file"
              exit 1
            else
              echo "✅ $file exists"
            fi
          done

      - name: Validate documentation links
        run: |
          echo "Checking documentation references..."
          # Check if README references exist in actual files
          if [ -f "README.md" ]; then
            echo "✅ README.md exists and can be validated"
          fi

      - name: Check file permissions
        run: |
          echo "Checking file permissions..."
          # Ensure no executable HTML/CSS/JS files (security)
          find . -name "*.html" -perm /111 2>/dev/null || true
          find . -name "*.css" -perm /111 2>/dev/null || true
          echo "✅ File permission check complete"

      - name: Validate test configuration
        run: |
          echo "Checking test configuration..."
          if [ -f "playwright.config.js" ]; then
            node --check playwright.config.js
            echo "✅ Playwright config is valid"
          fi

      - name: Summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✨ Code Quality Validation Complete"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "All quality checks passed!"
          echo "The codebase maintains consciousness-first standards."
          echo ""
